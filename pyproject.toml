[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparseworld-p0"
version = "0.1.0"
description = "P0 observability baseline for robot semantic-world sparse mapping"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
mcap = [
    "rosbags==0.11.5",
    "mcap==1.4.0",
]
calibration = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]
console = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
semantic = [
    "torch>=2.4",
    "transformers==4.48.3",
    "Pillow>=10.0",
    "socksio>=1.0",
    "timm>=1.0",
    "einops>=0.8",
]

[project.scripts]
sparseworld-p0 = "sparseworld_p0.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
