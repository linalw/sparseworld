[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparseworld-p0"
version = "0.1.0"
description = "P0 observability baseline for robot semantic-world sparse mapping"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
mcap = [
    "rosbags==0.11.5",
    "mcap==1.4.0",
]

[project.scripts]
sparseworld-p0 = "sparseworld_p0.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
